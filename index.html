<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something is Coming ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07060d;
    --bg-deep:#0d0a1c;
    --violet:#8a6cf0;
    --violet-soft:#5a3fb0;
    --pink:#f0a8d6;
    --pink-soft:#e390c4;
    --text:#f5f1fb;
    --muted:rgba(226,220,245,.58);
    --muted-dim:rgba(226,220,245,.38);
    --card:rgba(255,255,255,.035);
    --card-border:rgba(180,150,255,.16);
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    height:100%;
  }

  body{
    min-height:100vh;
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    color:var(--text);
    background:var(--bg);
    overflow:hidden;
    position:relative;
  }

  /* ---------- ambient background ---------- */

  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 38%, rgba(93,58,163,.24), transparent 70%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 55%, #050409 100%);
  }

  .nebula{
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(38% 30% at 42% 32%, rgba(138,108,240,.20), transparent 70%),
      radial-gradient(30% 26% at 62% 46%, rgba(240,168,214,.10), transparent 72%);
    filter:blur(6px);
    animation:drift 34s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(2%,-3%) scale(1.06)}
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(64px);
    pointer-events:none;
    z-index:0;
    opacity:.55;
  }
  .orb.tl{
    width:420px;height:420px;
    top:-160px;left:-140px;
    background:radial-gradient(circle,rgba(138,108,240,.55),transparent 70%);
    animation:breathe 12s ease-in-out infinite;
  }
  .orb.br{
    width:480px;height:480px;
    bottom:-200px;right:-160px;
    background:radial-gradient(circle,rgba(240,168,214,.42),transparent 70%);
    animation:breathe 12s ease-in-out infinite -6s;
  }
  .orb.mid{
    width:260px;height:260px;
    top:58%;left:-120px;
    background:radial-gradient(circle,rgba(120,90,220,.30),transparent 72%);
    animation:breathe 15s ease-in-out infinite -3s;
  }
  @keyframes breathe{
    0%,100%{opacity:.45;transform:scale(1)}
    50%{opacity:.7;transform:scale(1.08)}
  }

  #stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    background:#fff;
    border-radius:50%;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.12;transform:translateY(0)}
    50%{opacity:.95;transform:translateY(-2px)}
  }

  .shooting-star{
    position:absolute;
    width:0;
    height:1.5px;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff);
    border-radius:999px;
    filter:drop-shadow(0 0 5px #fff);
    transform-origin:left center;
    animation:shoot linear forwards;
  }
  @keyframes shoot{
    0%{width:0;transform:rotate(145deg) translateX(0);opacity:1}
    15%{width:80px}
    75%{width:80px;opacity:1}
    100%{width:0;transform:rotate(145deg) translateX(440px);opacity:0}
  }

  /* ---------- hero ---------- */

  .screen{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .wrap{
    width:min(880px,100%);
    text-align:center;
  }

  .eyebrow{
    letter-spacing:.32em;
    text-transform:uppercase;
    font-size:.7rem;
    font-weight:600;
    color:var(--muted);
    margin-bottom:26px;
    opacity:0;
    animation:rise .9s ease forwards .1s;
  }

  h1{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    font-size:clamp(2.6rem,7.5vw,5.6rem);
    line-height:1.05;
    margin:0;
    letter-spacing:.01em;
    background:linear-gradient(180deg,#ffffff 0%,#e9ddfb 60%,#cdb8f2 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:rise 1s ease forwards .25s;
  }

  h1 .emoji{
    -webkit-text-fill-color:initial;
    background:none;
    -webkit-background-clip:initial;
    background-clip:initial;
    color:initial;
  }

  .subtitle{
    color:var(--muted);
    font-size:clamp(.98rem,1.7vw,1.15rem);
    font-weight:400;
    margin:22px auto 0;
    max-width:520px;
    line-height:1.6;
    opacity:0;
    animation:rise 1s ease forwards .4s;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }

  .message{
    min-height:24px;
    color:var(--pink-soft);
    font-weight:600;
    font-size:.92rem;
    letter-spacing:.02em;
    margin:38px 0 30px;
    transition:opacity .5s ease, transform .5s ease;
  }

  .timer{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    max-width:640px;
    margin:0 auto;
  }

  .unit{
    position:relative;
    padding:24px 8px 20px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    backdrop-filter:blur(18px);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.02) inset,
      0 20px 40px -22px rgba(120,80,220,.35);
    transition:border-color .4s ease, box-shadow .4s ease;
  }
  .unit:hover{
    border-color:rgba(200,170,255,.32);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 0 32px -6px rgba(160,120,255,.45);
  }

  .number{
    display:block;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-weight:600;
    font-size:clamp(2rem,5.4vw,3.6rem);
    letter-spacing:.01em;
    color:#fdfbff;
  }
  .label{
    display:block;
    color:var(--muted-dim);
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:.6rem;
    font-weight:600;
    margin-top:6px;
  }

  .hint{
    margin-top:38px;
    color:var(--muted-dim);
    font-size:.8rem;
    font-weight:500;
    letter-spacing:.02em;
  }

  @media(max-width:640px){
    .timer{gap:10px}
    .unit{padding:18px 4px 16px;border-radius:16px}
    .orb.tl{width:280px;height:280px}
    .orb.br{width:300px;height:300px}
    .orb.mid{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="nebula"></div>
<div class="orb tl"></div>
<div class="orb br"></div>
<div class="orb mid"></div>
<div id="stars"></div>

<section class="screen">
  <main class="wrap">
    <div class="eyebrow">A little something is coming 🌟</div>
    <h1>Don't ask questions. <span class="emoji">👀</span></h1>
    <p class="subtitle">You have absolutely no idea what you've walked into.</p>

    <div id="rotating-message" class="message">You have absolutely no idea.</div>

    <div class="timer" aria-label="Countdown">
      <div class="unit">
        <span id="days" class="number">00</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span id="hours" class="number">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span id="minutes" class="number">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span id="seconds" class="number">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <div class="hint">Patience, intelligent one. 🤓</div>
  </main>
</section>

<script>
  /* ---------- starfield ---------- */
  const starsContainer = document.getElementById("stars");
  const STAR_COUNT = 80;

  for (let i = 0; i < STAR_COUNT; i++) {
    const star = document.createElement("div");
    star.className = "star";
    const size = Math.random() * 1.8 + 0.5;
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration = (Math.random() * 4 + 2.5) + "s";
    star.style.animationDelay = (Math.random() * 5) + "s";
    starsContainer.appendChild(star);
  }

  function spawnShootingStar() {
    const s = document.createElement("div");
    s.className = "shooting-star";
    s.style.top = Math.random() * 32 + "%";
    s.style.left = Math.random() * 55 + 25 + "%";
    const duration = Math.random() * 1 + 1.4;
    s.style.animationDuration = duration + "s";
    starsContainer.appendChild(s);
    setTimeout(() => s.remove(), duration * 1000 + 200);
  }
  setInterval(spawnShootingStar, 4200);

  /* ---------- rotating messages ---------- */
  const messages = [
    "No, it's not another reel.",
    "Yes, I actually planned this.",
    "Don't try to ragequit your way out of this.",
    "Patience, intelligent one. 🤓",
    "31 days is a suspiciously long time.",
    "No spoilers. 🫵🏻",
    "You can ask questions. I will probably ignore them.",
    "Something is getting closer.",
    "You should probably be patient.",
    "Okay fine, maybe one clue: 🎂"
  ];

  let messageIndex = 0;
  const messageEl = document.getElementById("rotating-message");

  setInterval(() => {
    messageEl.style.opacity = 0;
    messageEl.style.transform = "translateY(6px)";
    setTimeout(() => {
      messageIndex = (messageIndex + 1) % messages.length;
      messageEl.textContent = messages[messageIndex];
      messageEl.style.opacity = 1;
      messageEl.style.transform = "translateY(0)";
    }, 400);
  }, 4200);

  /* ---------- countdown ---------- */
  const target = new Date("2026-09-24T00:00:00+05:30").getTime();

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function updateCountdown() {
    const now = Date.now();
    const difference = target - now;

    if (difference <= 0) {
      document.getElementById("days").textContent = "00";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      return;
    }

    const days = Math.floor(difference / 86400000);
    const hours = Math.floor((difference % 86400000) / 3600000);
    const minutes = Math.floor((difference % 3600000) / 60000);
    const seconds = Math.floor((difference % 60000) / 1000);

    document.getElementById("days").textContent = pad(days);
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
